{% set name = "sphinxcontrib-googleanalytics" %}
{% set version = "0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: dc8740342331ff523b5eda8f5d1ea6176acfa86bbd195e8d67f642db8f2b22c7

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.2
    - pip
  run:
    - python >={{ python_min }}
    - sphinx >=0.6

test:
  imports:
    - sphinxcontrib
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/sphinx-contrib/googleanalytics
  summary: Sphinx extension googleanalytics
  license: BSD-4.3TAHOE
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - zaneselvans
